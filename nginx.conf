server {
    listen 80;
    listen [::]:80;
    listen 3030;
    listen [::]:3030;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Hide Server Version & Banner Information Disclosure
    server_tokens off;

    # 2. HTTP Security Headers (always flag ensures headers are returned on all responses, including errors)
    # HSTS (Strict-Transport-Security): Enforces HTTPS for 1 year, includes subdomains, preload-eligible
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content-Security-Policy (CSP): Restricts scripts, styles, frames, connects, and clickjacking while allowing Turnstile
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://challenges.cloudflare.com https://*.cloudflare.com; worker-src 'self' blob: https://challenges.cloudflare.com https://*.cloudflare.com; child-src 'self' blob: https://challenges.cloudflare.com https://*.cloudflare.com; connect-src 'self' http://localhost:9090 https://jenga-api.sintax.tz https://challenges.cloudflare.com https://*.cloudflare.com https://cloudflareinsights.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; font-src 'self' data:; frame-src https://challenges.cloudflare.com https://*.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Prevent Clickjacking (framing)
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (restrict sensitive hardware and browser APIs)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Disable legacy buggy XSS auditor in favor of CSP
    add_header X-XSS-Protection "0" always;

    # 3. Gzip Compression for Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 4. Desktop Application Installer Downloads (.exe)
    location ~* \.exe$ {
        add_header Content-Disposition 'attachment; filename="Jenga-Setup-Latest.exe"';
        add_header Content-Type 'application/vnd.microsoft.portable-executable';
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 5. Desktop Update Manifest (Prevent caching so client apps discover new releases immediately)
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "application/json" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 5. Vue SPA Routing (route all subpaths to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Static Assets Caching with Security Headers Preserved
    location ~* \.(?:css|js|woff|woff2|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # 6. Block access to hidden/sensitive files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
